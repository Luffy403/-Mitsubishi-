<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="shortcut icon" href="svg/icon.png" type="image/x-icon" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
      rel="stylesheet"
    />
    <title>Автосалон "Mitsubishi"</title>
  </head>
  <body class="page">
    <header class="header">
      <div class="container">
        <nav class="navbar">
          <a href="index.html" class="logo">
            <img class="logo__image" src="svg/icon.png" alt="Иконка" />
            <h1 class="logo__title">Mitsubishi</h1>
          </a>
          <ul class="nav">
            <li><a class="nav__link" href="index.html">Главная</a></li>
            <li><a class="nav__link" href="catalog.html">Каталог</a></li>
            <li><a class="nav__link" href="services.html">Услуги</a></li>
            <li><a class="nav__link" href="stocks.html">Акции</a></li>
            <li><a class="nav__link" href="about.html">О нас</a></li>
            <li><a class="nav__link" href="contacts.html">Контакты</a></li>
          </ul>
          <div class="dropdown">
            <button id="myButton" class="dropdown__button">
              <img class="dropdown__image" src="svg/Menu.svg" alt="меню" />
            </button>
            <ul id="myDropdown" class="dropdown__menu">
              <li class="dropdown__item">
                <a class="dropdown__link" href="index.html">Главная</a>
              </li>
              <li class="dropdown__item">
                <a class="dropdown__link" href="catalog.html">Каталог</a>
              </li>
              <li class="dropdown__item">
                <a class="dropdown__link" href="services.html">Услуги</a>
              </li>
              <li class="dropdown__item">
                <a class="dropdown__link" href="stocks.html">Акции</a>
              </li>
              <li class="dropdown__item">
                <a class="dropdown__link" href="about.html">О нас</a>
              </li>
              <li class="dropdown__item">
                <a class="dropdown__link" href="contacts.html">Контакты</a>
              </li>
            </ul>
          </div>
        </nav>
      </div>
    </header>

    <main class="main main--centered">
      <section class="slider">
        <div class="container slider__container">
          <div class="slider__content">
            <button class="slider__button" id="slide-left">
              <img
                class="slider__button-image"
                src="svg/ArrowLeft.svg"
                alt="влево"
              />
            </button>
            <div class="slider__frame">
              <img
                src="img/митсубиси.png"
                class="slider__image slider__image--active"
                alt="1 фотка"
              />
              <img
                src="img/митсубиси1.png"
                class="slider__image slider__image--hidden"
                alt="2 фотка"
              />
              <img
                src="img/митсубиси2.png"
                class="slider__image slider__image--hidden"
                alt="3 фотка"
              />
              <img
                src="img/митсубиси3.png"
                class="slider__image slider__image--hidden"
                alt="4 фотка"
              />
              <img
                src="img/митсубиси4.png"
                class="slider__image slider__image--hidden"
                alt="5 фотка"
              />
              <img
                src="img/митсубиси5.png"
                class="slider__image slider__image--hidden"
                alt="6 фотка"
              />
              <img
                src="img/митсубиси6.png"
                class="slider__image slider__image--hidden"
                alt="7 фотка"
              />
              <img
                src="img/митсубиси7.png"
                class="slider__image slider__image--hidden"
                alt="8 фотка"
              />
            </div>
            <button class="slider__button" id="slide-right">
              <img
                class="slider__button-image"
                src="svg/ArrowRight.svg"
                alt="вправо"
              />
            </button>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="container">
        <div class="footer__content">
          <img src="svg/icon.png" class="footer__logo" alt="Иконка" />
          <span class="footer__text">Все права защищены</span>
        </div>
      </div>
    </footer>

    <script src="js/script.js"></script>
    <script src="js/dropdown.js"></script>
  </body>
</html>
